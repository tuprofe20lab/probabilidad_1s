                return <div className="w-2.5 h-2.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-xl select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-3 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-12 h-12 sm:w-15 sm:h-15 bg-gradient-to-br from-white to-slate-200 rounded-xl border-[2.5px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1 shadow-inner border-[1.5px] border-indigo-500">
                            {getEyes()}
                            {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        // =========================================================================
        // 9. APLICACIÓN PRINCIPAL
        // =========================================================================
        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const scrollContainerRef = useRef(null);

            const curEx = EXERCISES[exIdx];
            const maxSteps = curEx.steps.length - 1;
            const curStepData = curEx.steps[step];
            const EnunciadoText = curEx.enunciado;

            const handleInteraction = () => {
                AudioController.init();
                AudioController.startBGM();
            };

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    AudioController.play(next === maxSteps ? 'success' : 'pop');
                } else {
                    AudioController.play('swoosh');
                    if (exIdx < EXERCISES.length - 1) {
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => {
                handleInteraction();
                setIsMuted(AudioController.toggleMute());
            };

            useEffect(() => {
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
                }
            }, [step, exIdx, view]);

            // ------------------------- VISTA PORTADA -------------------------
            if (view === 'home') {
                const block1 = EXERCISES.filter(e => e.block === 1);
                const block2 = EXERCISES.filter(e => e.block === 2);

                const renderCard = (ex) => {
                    const idx = EXERCISES.findIndex(item => item.id === ex.id);
                    return (
                        <button
                            key={ex.id}
                            onClick={() => startExercise(idx)}
                            className="group text-left p-4 rounded-[1.5rem] bg-white/10 backdrop-blur-xl border-[3px] border-white/30 hover:border-yellow-300 hover:-translate-y-1.5 hover:shadow-[0_18px_32px_rgba(0,0,0,0.35)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[9.5rem]"
                        >
                            <div className={`absolute inset-0 bg-gradient-to-br ${ex.cardGradient} opacity-85 group-hover:opacity-100 transition-opacity`}></div>
                            <div className="relative z-10 flex-1 flex flex-col">
                                <div className="flex items-center justify-between mb-2">
                                    <span className={`${ex.badgeColor} text-white text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-sm`}>
                                        Reto {ex.id}
                                    </span>
                                    <span className="text-white/90 text-xs font-extrabold">{ex.steps.length} pasos</span>
                                </div>
                                <div className="flex-1 my-1.5 bg-white/95 rounded-xl px-2.5 py-2 text-slate-900 shadow-inner flex items-center justify-center border border-white/60 pointer-events-none math-card">
                                    <MathDisplay latex={ex.previewLatex} align="center" />
                                </div>
                                <div className="text-white text-sm font-black text-center mt-1.5 drop-shadow-md">
                                    {ex.subtitle}
                                </div>
                            </div>
                        </button>
                    );
                };

                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e3a8a] via-[#4338ca] to-[#be185d] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto scrollbar-hide">
                        <FloatingBackground />

                        {/* Barra superior de portada */}
                        <div className="w-[96%] max-w-[1400px] z-20 flex items-center justify-between mb-6 mt-1">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-xs sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} title="Activar/Silenciar audio" className="p-2.5 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        {/* Títulos principales */}
                        <div className="relative z-10 text-center w-[96%] max-w-[1400px] flex flex-col items-center pb-12">
                            <span className="px-4 py-1 rounded-full bg-cyan-400/20 border border-cyan-300/60 text-cyan-200 font-black uppercase tracking-widest text-xs sm:text-sm mb-3">
                                Aritmética - Secundaria
                            </span>
                            <h1 className="text-4xl sm:text-6xl md:text-7xl font-black text-white mb-3 drop-shadow-[0_6px_0_rgba(0,0,0,0.3)] tracking-tight leading-none uppercase">
                                Tema: <span className="text-yellow-300 underline decoration-wavy decoration-cyan-400">Probabilidad</span>
                            </h1>
                            <p className="text-sm sm:text-lg lg:text-xl text-purple-100 mb-8 font-bold max-w-3xl leading-relaxed">
                                Regla de Laplace paso a paso con representaciones geométricas interactivas y pizarra digital 🎲📐🤖
                            </p>

                            {/* Bloque 1 */}
                            <div className="w-full mb-8">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-xl bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm uppercase tracking-wider shadow-md">
                                        Bloque 1 · Actividad para la Clase (1 - 6)
                                    </span>
                                    <div className="flex-1 h-0.5 bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                                    {block1.map(renderCard)}
                                </div>
                            </div>

                            {/* Bloque 2 */}
                            <div className="w-full">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-xl bg-cyan-400 text-slate-900 font-black text-xs sm:text-sm uppercase tracking-wider shadow-md">
                                        Bloque 2 · Práctica Adicional (7 - 12)
                                    </span>
                                    <div className="flex-1 h-0.5 bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                                    {block2.map(renderCard)}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ------------------------- VISTA LABORATORIO -------------------------
            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] text-slate-800 flex flex-col p-2 sm:p-3.5 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Barra superior de navegación */}
                    <div className="shrink-0 relative z-10 w-[98%] max-w-[1440px] mx-auto flex justify-between items-center mb-2.5 px-1 gap-2">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { AudioController.play('swoosh'); setView('home'); }}
                                className="flex items-center justify-center px-3.5 py-2 rounded-[1rem] bg-white/10 border-[2.5px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-xs sm:text-sm"
                            >
                                <Home className="w-4 h-4 sm:w-5 sm:h-5 sm:mr-1.5" />
                                <span className="hidden sm:inline">Portada</span>
                            </button>
                            <div className="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 border border-yellow-300/40 text-yellow-300 font-black text-xs uppercase tracking-wider">
                                <Rocket className="w-4 h-4" /> Aritmética · Probabilidad
                            </div>
                        </div>

                        {/* Selector rápido 1-12 */}
                        <div className="flex items-center gap-1 sm:gap-1.5 bg-black/35 p-1.5 rounded-[1rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[60vw]">
                            {EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`shrink-0 w-7 h-7 sm:w-9 sm:h-9 rounded-[0.7rem] font-black text-xs sm:text-sm transition-all ${
                                        exIdx === i
                                            ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_12px_rgba(250,204,21,0.7)]'
                                            : 'text-white hover:bg-white/20'
                                    }`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} title="Audio" className="p-2 sm:p-2.5 rounded-[1rem] bg-white/10 border-[2.5px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95">
                            {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                        </button>
                    </div>

                    {/* Contenedor principal de la pizarra */}
                    <div className="flex-1 min-h-0 relative z-10 w-[98%] max-w-[1440px] mx-auto bg-white rounded-[1.8rem] sm:rounded-[2.2rem] border-[5px] sm:border-[7px] border-slate-100 shadow-[0_25px_55px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
                        
                        {/* Cabecera oscura con enunciado */}
                        <div className="shrink-0 bg-slate-900 border-b-[4px] border-cyan-500 px-4 py-2.5 sm:px-6 sm:py-3 flex flex-col justify-center relative shadow-md z-20">
                            <div className="flex justify-between items-center w-full max-w-6xl mx-auto mb-1.5">
                                <div className="flex items-center gap-2">
                                    <span className="bg-cyan-500 text-slate-900 font-black text-xs px-2.5 py-0.5 rounded-md uppercase tracking-widest shadow-sm">
                                        {curEx.title}
                                    </span>
                                    <span className="text-slate-300 font-bold text-xs hidden sm:inline">
                                        {curEx.block === 1 ? 'Bloque 1 · Clase' : 'Bloque 2 · Práctica'}
                                    </span>
                                </div>
                                <span className="text-yellow-300 font-extrabold text-xs sm:text-sm bg-white/10 px-3 py-0.5 rounded-md">
                                    {curEx.subtitle}
                                </span>
                            </div>
                            <div className="text-white font-bold text-sm sm:text-base md:text-lg text-center w-full max-w-5xl mx-auto leading-snug math-enunciado">
                                <EnunciadoText />
                            </div>
                        </div>

                        {/* Área dividida 50% / 50% */}
                        <div className="flex-1 flex flex-col md:flex-row bg-slate-50 overflow-hidden relative">
                            
                            {/* PANEL IZQUIERDO: DESARROLLO PASO A PASO SIN CAJAS */}
                            <div
                                ref={scrollContainerRef}
                                className="w-full md:w-1/2 flex-1 px-5 py-5 sm:px-8 sm:py-6 overflow-y-auto scrollbar-hide flex flex-col gap-5 pb-20 relative z-10 border-b-2 md:border-b-0 md:border-r-2 border-slate-200/70"
                            >
                                {/* Patrón sutil de cuaderno de puntos */}
                                <div className="absolute inset-0 opacity-[0.04] bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px] pointer-events-none"></div>
                                
                                <div className="relative z-10 flex items-center justify-between border-b border-slate-200 pb-2 mb-1">
                                    <span className="text-xs font-black uppercase tracking-widest text-indigo-600">
                                        Desarrollo Paso a Paso (Regla de Laplace)
                                    </span>
                                    <span className="text-xs font-extrabold text-slate-400">
                                        <MathDisplay inline latex="P(A)=\frac{n(A)}{n(\Omega)}" />
                                    </span>
                                </div>

                                {curEx.steps.slice(0, step + 1).map((s, idx) => {
                                    const isCurrent = idx === step;
                                    const isFinal = isCurrent && step === maxSteps;
                                    return (
                                        <div
                                            key={`${exIdx}-${idx}`}
                                            className={`relative z-10 pl-4 transition-all duration-300 border-l-[4px] ${
                                                isFinal
                                                    ? 'border-emerald-500 opacity-100 animate-slideInRight'
                                                    : isCurrent
                                                        ? 'border-cyan-500 opacity-100 animate-slideInRight'
                                                        : 'border-slate-300 opacity-55'
                                            }`}
                                        >
                                            <div className="mb-1 flex items-center gap-2">
                                                <span
                                                    className={`inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full font-black text-[11px] sm:text-xs tracking-wide ${
                                                        isFinal
                                                            ? 'bg-emerald-500 text-white shadow-sm'
                                                            : isCurrent
                                                                ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-sm'
                                                                : 'bg-slate-200 text-slate-600'
                                                    }`}
                                                >
                                                    {isCurrent && <Sparkles className="w-3.5 h-3.5" />}
                                                    {s.badge}
                                                </span>
                                            </div>
                                            {/* Expresión matemática limpia y fluida SIN caja */}
                                            <div
                                                className={`py-1 ${
                                                    isFinal
                                                        ? 'math-final'
                                                        : isCurrent
                                                            ? 'math-current'
                                                            : 'math-history'
                                                }`}
                                            >
                                                <MathDisplay latex={s.latex} align="left" />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* PANEL DERECHO: REPRESENTACIÓN GRÁFICA CON FIGURAS GEOMÉTRICAS */}
                            <div className="w-full md:w-1/2 flex-1 bg-white/70 p-3 sm:p-5 flex flex-col items-center justify-center relative z-10 pointer-events-none">
                                <h3 className="absolute top-3 left-4 font-black text-slate-400 uppercase tracking-widest text-[11px] sm:text-xs flex items-center gap-1.5 z-20">
                                    <Shapes className="w-4 h-4 text-cyan-500" /> Representación Geométrica
                                </h3>
                                <div className="w-full h-full flex items-center justify-center pt-5 pointer-events-auto">
                                    <ProbabilityGraphic key={`g-${exIdx}-${step}`} exerciseId={curEx.id} step={step} />
                                </div>
                            </div>

                            {/* Pizarra superpuesta interactiva */}
                            <DrawingCanvas />
                        </div>

                        {/* Barra del Robot Asistente */}
                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-6 sm:py-2.5 flex items-center gap-3 sm:gap-5 border-t-[3px] border-slate-100 z-30 relative shadow-[0_-8px_18px_rgba(0,0,0,0.04)]">
                            <div className="shrink-0 absolute -top-9 sm:relative sm:top-0 left-3 sm:left-0 drop-shadow-xl z-50">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-xs sm:text-sm md:text-base font-bold text-slate-700 leading-snug bg-blue-50/85 px-3 py-2 sm:px-4 sm:py-2.5 rounded-[1rem] border-2 border-blue-100 min-h-[2.8rem] flex items-center shadow-sm ml-[3.4rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {curStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Barra inferior de controles de paso */}
                        <div className="shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-2.5 w-full flex flex-col items-center border-t-[3px] border-white z-40">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-3 h-9 sm:h-10">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]"
                                >
                                    <ChevronLeft className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>
                                <div className="bg-[#6366f1] text-white font-black px-3 sm:px-5 text-xs sm:text-sm flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[4.5rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>
                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#06b6d4] to-[#0284c7] border-[#0369a1]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EXERCISES.length - 1
                                                ? `Siguiente Reto (${curEx.id + 1})`
                                                : '¡Volver a Portada!'}
                                    </span>
                                    <ChevronRight className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
